# Render.com Blueprint — declares the backend web service and managed PostgreSQL.
# Docs: https://render.com/docs/blueprint-spec
#
# First-time setup:
#   1. Connect this repo in the Render dashboard → "New Blueprint"
#   2. After the database is created, Render auto-injects DB_HOST/DB_PORT/DB_NAME/DB_USERNAME/DB_PASSWORD
#   3. Set the secrets marked `sync: false` in the Render dashboard (Environment tab)
#   4. Trigger the first deploy manually or push to main

services:
  - type: web
    name: trading-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    branch: main
    plan: free           # change to `starter` or higher for always-on (no cold starts)
    healthCheckPath: /actuator/health

    envVars:
      # ── Database — auto-injected from the managed Postgres below ─────────────
      - key: DB_HOST
        fromDatabase:
          name: trading-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: trading-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: trading-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: trading-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: trading-db
          property: password

      # ── Secrets — set these in the Render dashboard, never commit values ─────
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false

      # ── CORS / cookies — set to your Vercel domain after first frontend deploy
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # e.g. https://your-app.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: FRONTEND_URL
        sync: false   # e.g. https://your-app.vercel.app  (used for Zerodha OAuth redirect)

      # ── Zerodha Kite Connect ─────────────────────────────────────────────────
      - key: ZERODHA_API_KEY
        sync: false
      - key: ZERODHA_API_SECRET
        sync: false

      # ── Optional integrations ────────────────────────────────────────────────
      - key: SHEETS_ENABLED
        value: "false"
      - key: SHEETS_SPREADSHEET_ID
        sync: false
      - key: TELEGRAM_ENABLED
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false

databases:
  - name: trading-db
    plan: free         # free tier is available; expires after 90 days — upgrade for persistence
    databaseName: trading
    user: trading
