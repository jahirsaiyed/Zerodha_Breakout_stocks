spring:
  application:
    name: trading-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trading}
    username: ${DB_USERNAME:trading}
    password: ${DB_PASSWORD:trading}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

encryption:
  key: ${ENCRYPTION_KEY}

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

cookie:
  secure: ${COOKIE_SECURE:false}

logging:
  level:
    root: INFO
    com.trading: DEBUG
