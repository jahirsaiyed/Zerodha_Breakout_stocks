spring:
  application:
    name: trading-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trading}
    username: ${DB_USERNAME:trading}
    password: ${DB_PASSWORD:trading}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 9006

jwt:
  secret: ${JWT_SECRET:testvbeh45u6j64j6wh5j66j55wh45j75wtyrh45wu76j5765j6j65j66u6j665j57k5k57k75k57k7k75}

encryption:
  key: ${ENCRYPTION_KEY:testvbeh45u6j64j6wh5j66j55wh45j75wtyrh45wu76j5765j6j65j66u6j665j57k5k57k75k57k7k75}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

cookie:
  secure: ${COOKIE_SECURE:false}

portfolio:
  scoring:
    proximity-weight: ${SCORING_PROXIMITY_WEIGHT:0.6}
    risk-reward-weight: ${SCORING_RISK_REWARD_WEIGHT:0.4}

zerodha:
  base-url: ${ZERODHA_BASE_URL:https://api.kite.trade}
  connect-timeout-ms: ${ZERODHA_CONNECT_TIMEOUT_MS:10000}
  read-timeout-ms: ${ZERODHA_READ_TIMEOUT_MS:30000}

sheets:
  enabled: ${SHEETS_ENABLED:false}
  spreadsheet-id: ${SHEETS_SPREADSHEET_ID:}
  credentials-path: ${SHEETS_CREDENTIALS_PATH:}
  range: ${SHEETS_RANGE:Sheet1!A2:E}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.trading: DEBUG
