spring:
  application:
    name: trading-backend
  datasource:
    # DB_URL takes precedence (local dev / custom setups).
    # On Render, individual DB_HOST/DB_PORT/DB_NAME are injected from the managed database
    # and the JDBC URL is assembled from those when DB_URL is not set.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trading}}
    username: ${DB_USERNAME:trading}
    password: ${DB_PASSWORD:trading}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # Render.com injects PORT dynamically; fall back to 9006 for local development
  port: ${PORT:9006}

jwt:
  secret: ${JWT_SECRET:testvbeh45u6j64j6wh5j66j55wh45j75wtyrh45wu76j5765j6j65j66u6j665j57k5k57k75k57k7k75}

encryption:
  key: ${ENCRYPTION_KEY:testvbeh45u6j64j6wh5j66j55wh45j75wtyrh45wu76j5765j6j65j66u6j665j57k5k57k75k57k7k75}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

cookie:
  secure: ${COOKIE_SECURE:false}

portfolio:
  scoring:
    proximity-weight: ${SCORING_PROXIMITY_WEIGHT:0.6}
    risk-reward-weight: ${SCORING_RISK_REWARD_WEIGHT:0.4}

zerodha:
  api-key: ${ZERODHA_API_KEY:}
  api-secret: ${ZERODHA_API_SECRET:}
  base-url: ${ZERODHA_BASE_URL:https://api.kite.trade}
  login-base-url: ${ZERODHA_LOGIN_BASE_URL:https://kite.zerodha.com/connect/login?v=3&api_key=}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  connect-timeout-ms: ${ZERODHA_CONNECT_TIMEOUT_MS:10000}
  read-timeout-ms: ${ZERODHA_READ_TIMEOUT_MS:30000}
  order-base-url: ${ZERODHA_ORDER_BASE_URL:}

sheets:
  enabled: ${SHEETS_ENABLED:false}
  spreadsheet-id: ${SHEETS_SPREADSHEET_ID:}
  credentials-path: ${SHEETS_CREDENTIALS_PATH:}
  range: ${SHEETS_RANGE:'NSE Stock break out Ideas'!A2:Q}

telegram:
  # Bot token and enabled flag are stored in the database and configured via the admin UI.
  # Only the API base URL remains here as an infrastructure-level override.
  base-url: ${TELEGRAM_BASE_URL:https://api.telegram.org}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.trading: INFO
